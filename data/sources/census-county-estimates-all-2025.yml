id: census-county-estimates-all-2025
version: '1.0'
title: County Estimates All Data 2025
provider:
  name: U.S. Census Bureau
  agency: U.S. Department of Commerce
  url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/counties/totals/
requires_account: false
download:
  url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/counties/totals/co-est2025-alldata.csv
  description: Link downloads a CSV file.
  file_size: 2023 KB
variables:
- SUMLEV
- REGION
- DIVISION
- STATE
- COUNTY
- STNAME
- CTYNAME
- ESTIMATESBASE2020
- POPESTIMATE2020 through POPESTIMATE2025
- NPOPCHG2020 through NPOPCHG2025
- BIRTHS2020 through BIRTHS2025
- DEATHS2020 through DEATHS2025
- NATURALCHG2020 through NATURALCHG2025
- INTERNATIONALMIG2020 through INTERNATIONALMIG2025
- DOMESTICMIG2020 through DOMESTICMIG2025
- NETMIG2020 through NETMIG2025
- RESIDUAL2020 through RESIDUAL2025
- GQESTIMATESBASE2020
- GQESTIMATES2020 through GQESTIMATES2025
- RBIRTH2021 through RBIRTH2025
- RDEATH2021 through RDEATH2025
- RNATURALCHG2021 through RNATURALCHG2025
- RINTERNATIONALMIG2021 through RINTERNATIONALMIG2025
- RDOMESTICMIG2021 through RDOMESTICMIG2025
- RNETMIG2021 through RNETMIG2025
notes: 'SUMLEV: summary level (40 = state, 50 = county). NPOPCHG: net population change.
  NATURALCHG: births minus deaths. GQESTIMATES: population in group quarters (prisons,
  dorms, nursing homes, etc.). RBIRTH/RDEATH/RNETMIG: rates per 1,000 people.'
sensitive: false
description_tags:
  Agriculture: false
  Business & Finance: false
  Children & Families: false
  Economy: false
  Election: false
  PreK-12 Education: false
  Energy & Environment: true
  Government Administration: false
  Health & Social Services: false
  Higher Education: false
  Historic Preservation: false
  Housing & Buildings: false
  Labor & Workforce Development: false
  Law & Public Safety: false
  Parks & Recreation: false
  Population Data: true
  Public Utilities: false
  Restaurant and Food Service: false
  Transportation: false
who: U.S. Census Bureau (U.S. Department of Commerce)
how: Statistical estimation from administrative records and surveys
where: County-level
why: null
when: '2025'
geographic_coverage:
  available_levels:
    state_fips: true
    fips_code: true
    zip_code: true
    school_district: false
    tract: true
    tribal_area: false
  url_template:
    state: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=state:{state_fips}&key={api_key}
    county: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=county:{county_fips}&in=state:{state_fips}&key={api_key}
    zip: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=zip%20code%20tabulation%20area:{zip_code}&key={api_key}
    tract: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=tract:*&in=state:{state_fips}%20county:{county_fips}&key={api_key}
