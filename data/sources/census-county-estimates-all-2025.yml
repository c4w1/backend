- RINTERNATIONALMIG2021 through RINTERNATIONALMIG2025
- RDOMESTICMIG2021 through RDOMESTICMIG2025
- RNETMIG2021 through RNETMIG2025
notes: 'SUMLEV: summary level (40 = state, 50 = county). NPOPCHG: net population change.
  NATURALCHG: births minus deaths. GQESTIMATES: population in group quarters (prisons,
  dorms, nursing homes, etc.). RBIRTH/RDEATH/RNETMIG: rates per 1,000 people.'
sensitive: false
description_tags:
- Business & Economy
- Population Data
who: U.S. Census Bureau (U.S. Department of Commerce)
how: Statistical estimation from administrative records and surveys
where: County-level
why: null
when: '2025'
geographic_coverage:
  available_levels:
    state_fips: true
    fips_code: true
    zip_code: true
    school_district: false
    tract: true
    tribal_area: false
  url_template:
    state: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=state:{state_fips}&key={api_key}
    county: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=county:{county_fips}&in=state:{state_fips}&key={api_key}
    zip: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=zip%20code%20tabulation%20area:{zip_code}&key={api_key}
    tract: https://api.census.gov/data/{year}/{dataset}?get={variables}&for=tract:*&in=state:{state_fips}%20county:{county_fips}&key={api_key}

