about: 'County Health Rankings & Roadmaps publishes a yearly set of health measures
  for nearly every county in the United States. This is the 2025 national analytic
  file: one row per county, with state and national rows for comparison.


  ## What''s Included


  - **Health outcomes**: Premature death, poor physical and mental health days, low
  birthweight

  - **Health behaviors**: Adult smoking, obesity, physical inactivity, excessive drinking

  - **Clinical care**: Uninsured rates, primary care and mental health provider ratios,
  preventable hospital stays

  - **Social & economic factors**: High school completion, unemployment, income inequality,
  child poverty

  - **Physical environment**: Air pollution, housing problems, access to parks and
  healthy food


  ## Using the Data


  The first data row holds variable codes rather than values; skip it when loading
  the file. Filter on `State FIPS Code` and `County FIPS Code` to find a county: Knox
  County, Tennessee is state `47`, county `093`.


  ## Community Use


  - Identify the leading preventable causes of premature death in your county.

  - Compare your county with neighboring counties and the state average.

  - Use social and economic measures to target community health work.


  ## Classroom Use


  - **Health disparities**: How do outcomes differ between counties with different
  income levels?

  - **Policy analysis**: Which measures move together across counties, and which don''t?

  - **Data visualization**: Build a dashboard comparing one county''s health measures
  with its state.

  '
