notes: 'The file has two header rows: readable column names, then short variable codes
  (statecode, countycode, v001_rawvalue, ...), so the codes appear as the first data
  row. Rows are identified by State FIPS Code and County FIPS Code; county code 000
  is a state (or U.S.) total. Each measure has a raw value, numerator, denominator,
  confidence interval, and reliability flag. Variable definitions are in the 2025
  data dictionary on the provider page.'
description: County-level health indicators for every U.S. county, including premature
